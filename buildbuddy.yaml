plugins:
  - repo: buildbuddy-io/plugins
    path: open-invocation
  - repo: siggisim/theme-modern
  - repo: buildbuddy-io/plugins
    path: notify

actions:
  - name: "BuildBuddy Workflows"
    triggers:
      push:
        branches:
          - "*"
      pull_request:
        branches:
          - "*"
    bazel_workspace_dir: "examples"
    bazel_commands:
      - "build --config=buildbuddy --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_WINDOWS_WSL} //HelloWorld:HelloWorld"
